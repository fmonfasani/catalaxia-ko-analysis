const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

const val = v => v === null || v === undefined || v === '' ? '—' : esc(v);
const $ = id => document.getElementById(id);

const cardsEl  = $('cards');
const sheetEl  = $('sheet');
const periodEl = $('period');
const statusEl = $('status');
const searchEl = $('search');
const tbodyEl  = $('tbody');

function filteredRows() {
  const sh = sheetEl.value;
  const pe = periodEl.value;
  const st = statusEl.value;
  const q = searchEl.value.trim().toLowerCase();

  return DATA.filter(x =>
    (!sh || x.sheet === sh) &&
    (!pe || x.period === pe) &&
    (!st || x.status === st) &&
    (!q || String(x.metric ?? '').toLowerCase().includes(q))
  );
}

function init() {
  const ps = [...new Set(DATA.map(x => x.period))].sort();
  periodEl.innerHTML =
    '<option value="">Todos los períodos</option>' +
    ps.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  render();
}

function render() {
  const rows = filteredRows();

  const counts = {
    total: rows.length,
    MATCH: rows.filter(x => x.status === 'MATCH').length,
    CLOSE: rows.filter(x => x.status === 'CLOSE').length,
    DIFFERENCE: rows.filter(x => x.status === 'DIFFERENCE').length
  };

  const comparable = counts.MATCH + counts.CLOSE + counts.DIFFERENCE;
  const mc = comparable
    ? ((counts.MATCH + counts.CLOSE) / comparable * 100).toFixed(1)
    : '0.0';

  cardsEl.innerHTML = `
    <div class="card"><b>${counts.total}</b><span>Total</span></div>
    <div class="card"><b>${counts.MATCH}</b><span>MATCH</span></div>
    <div class="card"><b>${counts.CLOSE}</b><span>CLOSE</span></div>
    <div class="card"><b>${counts.DIFFERENCE}</b><span>DIFFERENCE</span></div>
    <div class="card"><b>${mc}%</b><span>MATCH + CLOSE</span></div>
  `;

  tbodyEl.innerHTML = rows.map(x => `
    <tr>
      <td>${val(x.sheet)}</td>
      <td>${val(x.metric)}</td>
      <td>${val(x.period)}</td>
      <td class="num">${val(x.tikr)}</td>
      <td class="num">${val(x.catalaxia)}</td>
      <td class="num">${val(x.diff)}</td>
      <td class="num">${val(x.diff_pct)}</td>
      <td><span class="status ${String(x.status ?? '').toLowerCase()}">${val(x.status)}</span></td>
    </tr>
  `).join('');

  if (!rows.length) {
    tbodyEl.innerHTML = `
      <tr><td colspan="8" style="text-align:center;padding:28px">
        No hay registros para los filtros seleccionados.
      </td></tr>`;
  }
}

function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCSV() {
  const rows = filteredRows();
  const headers = [
    'Statement','Métrica','Período','TIKR','Catalaxia',
    'Diff','Diff %','Estado'
  ];

  const lines = [
    headers.map(csvCell).join(','),
    ...rows.map(x => [
      x.sheet, x.metric, x.period, x.tikr, x.catalaxia,
      x.diff, x.diff_pct, x.status
    ].map(csvCell).join(','))
  ];

  // BOM para que Excel reconozca UTF-8 correctamente.
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {
    type: 'text/csv;charset=utf-8;'
  });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'catalaxia_ypf_tikr_filtrado.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

async function copyTable() {
  const rows = filteredRows();
  const headers = [
    'Statement','Métrica','Período','TIKR','Catalaxia',
    'Diff','Diff %','Estado'
  ];

  const text = [
    headers.join('\t'),
    ...rows.map(x => [
      x.sheet, x.metric, x.period, x.tikr, x.catalaxia,
      x.diff, x.diff_pct, x.status
    ].map(v => v ?? '').join('\t'))
  ].join('\n');

  try {
    await navigator.clipboard.writeText(text);
    $('copyTable').textContent = '✓ Copiado';
    setTimeout(() => $('copyTable').textContent = 'Copiar tabla', 1500);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    $('copyTable').textContent = '✓ Copiado';
    setTimeout(() => $('copyTable').textContent = 'Copiar tabla', 1500);
  }
}

[sheetEl, periodEl, statusEl, searchEl].forEach(el =>
  el.addEventListener('input', render)
);

$('exportCsv').addEventListener('click', exportCSV);
$('copyTable').addEventListener('click', copyTable);

init();
</script></body></html>
